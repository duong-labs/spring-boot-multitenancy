spring:
  application:
    name: multitenancy
  # Main (shared) database: holds the tenant registry only. In-memory H2.
  datasource:
    url: jdbc:h2:mem:main;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    # Must stay "none": the primary (tenant) EntityManagerFactory sits on a routing DataSource that
    # has no target at boot, so Boot must not probe it. The main EMF sets its own hbm2ddl.
    hibernate:
      ddl-auto: none
    open-in-view: false
